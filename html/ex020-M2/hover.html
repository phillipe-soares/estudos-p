<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block ;
            color: rgb(255, 255, 255);
            background-color: red;
        }  
        div:hover{
            color: brown;
        }
    </style>
</head>
<body>
    <h1>exemplo de hover</h1>
    <p>passa o mause ao texto abaixo</p>
    <div>passe o mause aqui
    <p>TEXTO EXCONDIDO...</p>

    </div>
    <p>FIM desse exemplo</p>
</body>
</html>
