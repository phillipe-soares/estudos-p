<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midias html5</title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>tente abrir esse site em varios disposituvos diferentes ou simplesmente aumente ou diminua o tamanho  do seu navegador</p>
   <picture>
    <source media="(max-width: 750px )" srcset="imagens/foto-p.png" type="image/png">
    <source media="(max-width:1050px )" srcset="imagens/foto-m.png" type="image/png">
    <img src="imagens/foto-g.png" alt="imagem flexivel">
   </picture>
    <h1>reproduzindo audios</h1>
    <p>vamos aprender reproduzir audios em html5</p>
   <audio preload="metadata"  controls> 
    <source src="midia/guanacast-33.mp3" type="audio/mpeg">
    <source src="midia/guanacast-33.ogg" type="audio/ogg">
    <source src="midia/guanacast-33.wav" type="audio/wav">
    <p>não foi possivel reproduzir o audio então abaixe o podicast</p>
    <a href="midia/guanacast-33.mp3">aqui</a>
   </audio >

</body>
</html>
