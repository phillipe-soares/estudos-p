<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>

/*Box-level */
   h1{
background-color: bisque;

height: 300px;
width: 300px;

border: 10px solid black;

padding: 10px 10px 10px 10px ;

margin: 10px 10px 10px 10px;


outline: 10px dashed red;
   }
   /*Inline-level */
   a{
    padding: 10px 10px 10px 10px;
    border: 10px solid rgb(146, 5, 5);
}
</style>
</head>
<body>
    <h1>Exemplos de caixas box-level</h1>
    <p>paragrafos também são exemplos de box-level mais também <a href="#">os links são exemplos de caixas inline-level</a> vamos ver como tudo isso funciona</p>
</body>
</html>
