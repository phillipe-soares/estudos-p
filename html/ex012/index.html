<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos com HTML5</title>
</head>
<body>
    <h1>inserindo videos hospedados localmente</h1>
    <p>Este video esta ospedado no meu proprio servidor</p>
    <video width="300" controls height="315">
        <source src="midia/meu-video mp4.mp4"
        type="video/mp4">
        <source src="midia/meu-video ogv.ogv" type="video/ogg">
        <source src="midia/Meu-Video webm.webm" type="video/webm">
        <source src="midia/meu-video-m4v.m4v" type="video/mp4">
        <p>seu navegador não tem compatibilidade com reprodução de videos</p>
        <a href="midia/meu-video mp4.mp4">aqui</a>
    </video>
    <h1>inserindo videos do youtube</h1>
<iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=NL91qPPsUfmiKvZg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
